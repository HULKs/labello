name: Deploy

on:
  repository_dispatch:
    types: [stable-release-published]

permissions:
  contents: read
  attestations: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable release
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: [self-hosted, linux, x64, "${{ vars.LABELLO_DEPLOY_RUNNER }}"]
    timeout-minutes: 30
    env:
      LABELLO_DEPLOY_ROOT: /var/lib/labello
    steps:
      - name: Validate dispatch payload
        env:
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
          SOURCE_COMMIT: ${{ github.event.client_payload.sourceCommit }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'invalid release tag in deployment dispatch\n' >&2
            exit 1
          fi
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'invalid source commit in deployment dispatch\n' >&2
            exit 1
          fi

      - name: Install pinned GitHub CLI in runner temp
        env:
          GH_ARCHIVE_URL: https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz
          GH_ARCHIVE_SHA256: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
        run: |
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl --fail --silent --show-error --location \
            "$GH_ARCHIVE_URL" \
            --output "$archive"
          printf '%s  %s\n' "$GH_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gh"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/gh" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/gh/bin" >> "$GITHUB_PATH"

      - name: Verify immutable release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
          SOURCE_COMMIT: ${{ github.event.client_payload.sourceCommit }}
        run: |
          target="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isImmutable,isPrerelease,tagName,targetCommitish \
            --jq 'select(.isDraft == false and .isImmutable == true and .isPrerelease == false) | .targetCommitish')"
          if [[ "$target" != "$SOURCE_COMMIT" ]]; then
            printf 'release is not immutable, stable, or bound to the dispatched commit\n' >&2
            exit 1
          fi

      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
          SOURCE_COMMIT: ${{ github.event.client_payload.sourceCommit }}
        run: |
          download="$RUNNER_TEMP/download"
          mkdir -p "$download"
          server_asset="labello-server-x86_64-linux-${RELEASE_TAG}.tar.gz"
          browser_asset="labello-browser-${RELEASE_TAG}.tar.gz"
          deployment_asset="labello-deployment-${RELEASE_TAG}.tar.gz"
          metadata_asset="release-metadata-${RELEASE_TAG}.json"
          payload_assets=("$server_asset" "$browser_asset" "$deployment_asset")
          expected_assets=("${payload_assets[@]}" "$metadata_asset" SHA256SUMS)
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$download" \
            --pattern "$server_asset" \
            --pattern "$browser_asset" \
            --pattern "$deployment_asset" \
            --pattern "$metadata_asset" \
            --pattern SHA256SUMS

          for asset in "${expected_assets[@]}"; do
            gh attestation verify "$download/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$SOURCE_COMMIT" >/dev/null
          done
          /var/lib/labello/bin/labello-deploy verify-release \
            "$download" "$RELEASE_TAG" "$SOURCE_COMMIT"

      - name: Submit deployment to the local transaction manager
        env:
          RELEASE_TAG: ${{ github.event.client_payload.releaseTag }}
        run: |
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          gzip --decompress --stdout \
            "$RUNNER_TEMP/download/labello-deployment-${RELEASE_TAG}.tar.gz" \
            | /var/lib/labello/bin/labello-deploy receive "$request_id"
          printf '%s\n' "$request_id" > "$RUNNER_TEMP/deployment-request-id"

      - name: Wait for durable deployment result
        run: |
          request_id="$(cat "$RUNNER_TEMP/deployment-request-id")"
          for _ in $(seq 1 180); do
            status="$(/var/lib/labello/bin/labello-deploy status "$request_id")"
            phase="$(printf '%s\n' "$status" | sed -n 's/.*"phase":"\([^"]*\)".*/\1/p')"
            case "$phase" in
              complete) exit 0 ;;
              rolled_back|first_install_failed|manual_recovery)
                printf 'deployment ended in %s\n' "$phase" >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          printf 'deployment transaction continues asynchronously; inspect its local status\n' >&2
          exit 1
