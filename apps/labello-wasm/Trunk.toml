[build]
target = "index.html"
dist = "dist"
public_url = "./"

[serve]
no_spa = true

[[hooks]]
stage = "pre_build"
command = "python3"
command_arguments = ["../../scripts/prepare-onnx-runtime.py"]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = [
    "-c",
    'if [ -f "$TRUNK_SOURCE_DIR/labello.client.json" ]; then cp "$TRUNK_SOURCE_DIR/labello.client.json" "$TRUNK_STAGING_DIR/labello.client.json"; fi',
]
