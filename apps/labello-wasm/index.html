<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Labello</title>
    <link data-trunk rel="rust" data-cargo-profile-release="wasm-release" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-simd --strip-debug" />
    <link rel="icon" type="image/svg+xml" href="./assets/labello-icon.svg" />
    <link data-trunk rel="copy-dir" href="../../assets" data-target-path="assets" />
    <style>
      html, body, canvas { width: 100%; height: 100%; margin: 0; background: #090e18; }
      body { overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; touch-action: none; }
      #startup-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        color: #94a3b8;
        background: #090e18;
        font-size: 15px;
        font-weight: 400;
        text-align: center;
        z-index: 10;
      }
      #startup-status[data-error="true"] { color: #f87171; }
      #startup-status img {
        width: 96px;
        height: 96px;
        justify-self: center;
      }
    </style>
    <script>
      window.__labelloRuntimeConfig = fetch(new URL("./labello.client.json", document.baseURI), {
        cache: "no-store",
        headers: { accept: "application/json" },
      });
      // Rust reports this failure after startup, even if the request fails
      // before the WASM module has finished downloading.
      window.__labelloRuntimeConfig.catch(() => {});
      function showStartupFailure(reason) {
        const status = document.getElementById("startup-status");
        if (!status) return;
        status.dataset.error = "true";
        status.textContent = `Labello could not start. Rebuild and redeploy the complete WASM distribution. Details: ${reason}`;
      }
      window.addEventListener("error", event => {
        showStartupFailure(event.message || "application asset failed to load");
      });
      window.addEventListener("unhandledrejection", event => {
        showStartupFailure(event.reason?.message || event.reason || "application startup was rejected");
      });
    </script>
  </head>
  <body>
    <div id="startup-status" role="status">
      <img src="./assets/labello-icon.svg" alt="" aria-hidden="true" />
      <span>Loading Labello...</span>
    </div>
    <canvas id="labello-canvas"></canvas>
  </body>
</html>
