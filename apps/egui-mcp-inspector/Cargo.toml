[package]
name = "labello-egui-mcp-inspector"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[workspace]

[workspace.package]
rust-version = "1.98"

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "inspection", "wayland", "x11"] }
labello-ui = { path = "../../crates/labello-ui", features = ["inspector-presets"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "time"] }
